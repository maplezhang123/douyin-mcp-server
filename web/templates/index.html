<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音文案提取器</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f4f6fa}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:38px 20px}
    header{margin-bottom:24px}h1{font-size:30px;margin:0 0 8px}.muted{color:#667085}
    .grid{display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:white;border:1px solid #e5e9f2;border-radius:16px;padding:22px;box-shadow:0 8px 30px #1720330a}
    label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}textarea,input,select{width:100%;padding:11px 12px;border:1px solid #cad2df;border-radius:9px;font:inherit;background:white}
    textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}
    button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:18px;background:#fe2c55;color:white;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.secondary{background:#172033}
    .status{padding:11px 13px;border-radius:9px;background:#fff4e5;color:#8a4b00;margin-top:16px}.error{background:#fff0f1;color:#b42318}
    .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.meta div{background:#f7f8fa;padding:11px;border-radius:9px;font-size:13px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fa;border-radius:10px;padding:15px;min-height:130px;line-height:1.7}
    .optional{font-weight:400;color:#667085}.tip{font-size:12px;color:#667085;margin-top:6px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:22px 14px}}
  </style>
</head>
<body><main class="wrap">
  <header><h1>抖音文案提取器</h1><div class="muted">普通视频、精选 modal_id 和短链接；HTTP 失败会自动启动浏览器。</div></header>
  <div class="grid">
    <section class="card">
      <label for="url">抖音链接</label>
      <textarea id="url" placeholder="粘贴 https://www.douyin.com/video/... 或 https://www.douyin.com/jingxuan?modal_id=..."></textarea>
      <label for="mode">识别方式</label>
      <select id="mode"><option value="cloud">云端 SenseVoice（推荐）</option><option value="local">本地 Whisper（可选）</option></select>
      <div id="cloudFields">
        <label for="silicon">SiliconFlow API Key（云端模式必需）</label>
        <input id="silicon" type="password" autocomplete="off" placeholder="sk-...">
        <div class="tip">仅保存在当前浏览器并发送到本机服务，不写入日志。</div>
      </div>
      <div id="localFields" hidden>
        <label for="model">Whisper 模型</label>
        <select id="model"><option>tiny</option><option selected>small</option><option>medium</option><option>large-v3</option></select>
        <div class="tip">首次使用可能自动下载模型；需先运行 uv sync --extra local。</div>
      </div>
      <label for="deepseek">DeepSeek API Key <span class="optional">（可选，用于文案整理）</span></label>
      <input id="deepseek" type="password" autocomplete="off" placeholder="留空则返回原始逐字稿">
      <div class="row"><button id="info" class="secondary">获取信息</button><button id="extract">提取文案</button></div>
      <div id="status" class="status" hidden></div>
    </section>
    <section class="card">
      <div id="empty" class="muted">结果将在这里显示。</div>
      <div id="result" hidden>
        <div class="meta">
          <div>标题<br><strong id="title"></strong></div><div>视频 ID<br><strong id="videoId"></strong></div>
          <div>解析方式<br><strong id="parser"></strong></div><div>ASR<br><strong id="asr"></strong></div>
          <div>耗时<br><strong id="elapsed"></strong></div>
        </div>
        <h3>原始逐字稿</h3><pre id="raw"></pre>
        <div id="organizedBox" hidden><h3>整理后文案</h3><pre id="organized"></pre></div>
      </div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id), mode=$("mode"), status=$("status");
["silicon","deepseek"].forEach(id=>$(id).value=localStorage.getItem("douyin_"+id)||"");
function setStatus(text,error=false){status.hidden=false;status.textContent=text;status.className="status"+(error?" error":"")}
function payload(){return{url:$("url").value.trim(),asr_mode:mode.value,siliconflow_api_key:$("silicon").value.trim(),deepseek_api_key:$("deepseek").value.trim(),local_model:$("model").value}}
mode.onchange=()=>{$("cloudFields").hidden=mode.value!=="cloud";$("localFields").hidden=mode.value!=="local"};
async function call(path,button){
  const data=payload(); if(!data.url){setStatus("请先粘贴抖音链接",true);return}
  if(path.endsWith("extract")&&data.asr_mode==="cloud"&&!data.siliconflow_api_key){setStatus("云端模式请填写 SiliconFlow API Key",true);return}
  localStorage.setItem("douyin_silicon",data.siliconflow_api_key);localStorage.setItem("douyin_deepseek",data.deepseek_api_key);
  button.disabled=true; setStatus(path.endsWith("extract")?"正在解析链接；必要时会启动浏览器降级，然后下载音频并识别…":"正在解析链接…");
  try{
    const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    const result=await response.json(); if(!result.success)throw new Error(result.error||"请求失败");
    $("empty").hidden=true;$("result").hidden=false;$("title").textContent=result.title||"（无标题）";$("videoId").textContent=result.video_id||"未知";
    $("parser").textContent=(result.parser||"http").toUpperCase();
    if(path.endsWith("extract")){
      $("asr").textContent=result.asr_model||result.asr_mode;$("elapsed").textContent=result.elapsed_seconds+" 秒";
      $("raw").textContent=result.raw_text;$("organizedBox").hidden=!result.organized_text;$("organized").textContent=result.organized_text||"";
      setStatus(result.organizer_error?"ASR 已完成；DeepSeek 整理失败，已保留原始逐字稿："+result.organizer_error:"完成");
    } else { $("asr").textContent="—";$("elapsed").textContent="—";$("raw").textContent="信息解析完成";setStatus("完成"); }
  }catch(error){setStatus(error.message,true)}finally{button.disabled=false}
}
$("info").onclick=()=>call("/api/video/info",$("info"));$("extract").onclick=()=>call("/api/video/extract",$("extract"));
</script></body></html>
