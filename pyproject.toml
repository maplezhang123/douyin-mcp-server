[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "douyin-mcp-server"
version = "1.5.0"
description = "Douyin link transcription and spoken-copy organization with local ASR"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Douyin MCP Server contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.0.0",
    "requests",
    "ffmpeg-python",
    "faster-whisper",
    "tqdm",
    "dashscope",
    "playwright>=1.63.0",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "jinja2",
]

[project.urls]
Upstream = "https://github.com/yzfly/douyin-mcp-server"

[project.scripts]
douyin-mcp-server = "douyin_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["douyin_mcp_server"]
